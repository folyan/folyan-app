name: Build Release APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    environment: env

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            pip-${{ runner.os }}-

      - uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      - run: |
          sudo apt update
          sudo apt install -y git zip unzip autoconf libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev \
            build-essential ccache libltdl-dev

      - run: |
          pip install --upgrade pip
          pip install "cython<3.0" virtualenv
          pip install --upgrade https://github.com/kivy/buildozer/archive/master.zip

      - run: |
          sudo chown -R runner:runner /usr/local

      - env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 --decode > ${{ github.workspace }}/release-key.keystore

      - env:
          P4A_RELEASE_KEYSTORE: ${{ github.workspace }}/release-key.keystore
          P4A_RELEASE_KEYSTORE_PASSWD: ${{ secrets.KEYSTORE_PASSWORD }}
          P4A_RELEASE_KEYALIAS: ${{ secrets.KEY_ALIAS }}
          P4A_RELEASE_KEYALIAS_PASSWD: ${{ secrets.KEY_PASSWORD }}
        run: |
          buildozer -v android release

      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download --repo google/bundletool --pattern 'bundletool-all-*.jar' --clobber -O bundletool.jar
          ls -l bundletool.jar

      - env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          AAB=$(ls bin/*.aab | head -n 1)
          java -jar bundletool.jar build-apks \
            --bundle="$AAB" \
            --output=bin/app.apks \
            --mode=universal \
            --ks=${{ github.workspace }}/release-key.keystore \
            --ks-key-alias="$KS_ALIAS" \
            --ks-pass="pass:$KS_PASS" \
            --key-pass="pass:$KEY_PASS"
          unzip -o bin/app.apks universal.apk -d bin
          mv bin/universal.apk bin/FolyanApp-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: FolyanApp-Release
          path: |
            bin/FolyanApp-release.apk
            bin/*.aab
