name: Build Release APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    environment: env

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip autoconf libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev \
            build-essential ccache libltdl-dev

      - name: Install Buildozer and Cython
        run: |
          pip install --upgrade pip
          pip install "cython<3.0" virtualenv
          pip install --upgrade https://github.com/kivy/buildozer/archive/master.zip

      - name: Decode Keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "Ошибка: Секрет KEYSTORE_BASE64 не найден в окружении env!"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 --decode > ${{ github.workspace }}/release-key.keystore

      - name: Build Release AAB with Buildozer
        env:
          P4A_RELEASE_KEYSTORE: ${{ github.workspace }}/release-key.keystore
          P4A_RELEASE_KEYSTORE_PASSWD: ${{ secrets.KEYSTORE_PASSWORD }}
          P4A_RELEASE_KEYALIAS: ${{ secrets.KEY_ALIAS }}
          P4A_RELEASE_KEYALIAS_PASSWD: ${{ secrets.KEY_PASSWORD }}
        run: |
          buildozer -v android release

      - name: Download bundletool
        run: |
          wget -q https://github.com/google/bundletool/releases/latest/download/bundletool-all.jar -O bundletool.jar

      - name: Convert AAB to signed APK
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          AAB=$(ls bin/*.aab | head -n 1)
          java -jar bundletool.jar build-apks \
            --bundle="$AAB" \
            --output=bin/app.apks \
            --mode=universal \
            --ks=${{ github.workspace }}/release-key.keystore \
            --ks-key-alias="$KS_ALIAS" \
            --ks-pass=env:KS_PASS \
            --key-pass=env:KEY_PASS
          unzip -o bin/app.apks universal.apk -d bin
          mv bin/universal.apk bin/FolyanApp-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FolyanApp-Release
          path: |
            bin/FolyanApp-release.apk
            bin/*.aab
